<section class="analytics-card" aria-labelledby="analytics-title">
  <div class="analytics-card__header">
    <div>
      <p class="analytics-card__eyebrow">Cloudflare Web Analytics</p>
      <h2 id="analytics-title">站点数据</h2>
    </div>
    <span class="analytics-card__status" id="analytics-status">正在加载…</span>
  </div>
  <div class="analytics-card__stats">
    <div>
      <strong id="analytics-page-views">-</strong>
      <span>过去 24 小时页面浏览</span>
    </div>
  </div>
  <div id="analytics-top-posts"></div>
</section>
<script>
  (() => {
    const status = document.getElementById("analytics-status");
    const pageViews = document.getElementById("analytics-page-views");
    const topPosts = document.getElementById("analytics-top-posts");

    fetch("/api/analytics")
      .then((response) => {
        if (!response.ok) throw new Error("analytics unavailable");
        return response.json();
      })
      .then((data) => {
        pageViews.textContent = data.last24Hours.pageViews;
        status.textContent = `更新于 ${new Date(data.updatedAt).toLocaleString("zh-CN")}`;
        const topHeading = document.createElement("h3");
        topHeading.textContent = "最热门文章";
        const topList = document.createElement("ol");
        data.topPosts.forEach((post) => {
          const item = document.createElement("li");
          const link = document.createElement("a");
          link.href = post.path;
          link.textContent = post.title;
          const views = document.createElement("span");
          views.textContent = `${post.pageViews} 次`;
          item.append(link, views);
          topList.append(item);
        });
        topPosts.replaceChildren(topHeading, topList);
      })
      .catch(() => {
        status.textContent = "统计数据暂时不可用";
      });
  })();
</script>
